# prose-ambiguity-check — the canon prose ratchet lint, run on every pull request (HR-13, HR-4).
#
# INSTALLED, step two of the new-workflow rule (docs/GATE-CONFIGURATION.md, the #135 ordering). Step one
# shipped this file at templates/prose-ambiguity-check.yml, registered in
# scripts/workflow_runner_policy_check.rb's PENDING_HOSTED_WORKFLOWS with its guard step frozen, so
# `main`'s trusted validator knew its exact shape before the file existed here; step two moved the file
# to .github/workflows/ and the name to PORTABLE_HOSTED_WORKFLOWS, so its absence is now a refusal. A
# `pull_request_target` workflow runs from the base branch's copy, so its first live run is the first
# pull request opened after step two merged.
#
# The pinned Nen binary reads the PR checkout against the trusted rules and base
# baseline. The PR supplies only the tree and its own shrink-only baseline.
# Findings, stale or grown baseline rows, and wiring errors fail the check.
#
# The hardening is prose-size-check.yml's, step for step: the guard from the trusted revision, the
# PR checkout as data, `persist-credentials: false` on both checkouts, the output fenced between
# `::stop-commands::` and a fresh token because file names and quoted text come from the PR's tree,
# the check created on the exact PR head and always finished. No `paths:` filter.
#
# ENFORCEMENT POSTURE: ADVISORY. The context is `canon-lint`; it becomes required only after one
# tagged release of green runs with a shrinking baseline (HR-13), by the maintainer's own ruleset
# edit (docs/GATE-CONFIGURATION.md). Renaming the job or the check silently un-requires it.
name: prose-ambiguity-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: prose-ambiguity-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

jobs:
  canon-lint:
    if: ${{ github.repository == 'zheref/hatsu' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start check on the exact PR head
        id: head_check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(gh api --method POST "repos/${REPO}/check-runs" -f name=canon-lint -f head_sha="$HEAD_SHA" -f status=in_progress --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head (data only — nothing from here is executed)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout guard code from the trusted workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false

      - name: Enforce workflow runner policy from trusted workflow revision
        shell: bash
        run: |
          set -euo pipefail
          ruby .trusted/scripts/workflow_runner_policy_check.rb --self-test "$PWD"

      - name: Read the pinned nen ref from trusted nen/contract.json
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          ref="$(jq -r '.dependency.pinned_ref // empty' .trusted/nen/contract.json)"
          [ -n "$ref" ] || { echo "::error::nen/contract.json carries no dependency.pinned_ref."; exit 1; }
          case "$ref" in
            *..*|*//*) echo "::error::dependency.pinned_ref '$ref' is not a valid git ref (contains '..' or '//')."; exit 1 ;;
          esac
          if [[ ! "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
            echo "::error::dependency.pinned_ref is not a plain git ref ([A-Za-z0-9][A-Za-z0-9._/-]{0,99}); refusing to use it in a URL or a shell."
            exit 1
          fi
          script_sha="$(jq -j '.dependency.bootstrap.scriptSha256 // empty' .trusted/nen/contract.json 2>/dev/null && printf .)" || script_sha=""
          script_sha="${script_sha%.}"
          [[ "$script_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::trusted bootstrap script digest must be 64 lowercase hex digits."; exit 1; }
          echo "script_sha=$script_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pinned nen ref: $ref"

      - name: Bootstrap nen at the trusted pinned ref (checksum-verified, two steps, never a pipe)
        id: nen
        env:
          PINNED_REF: ${{ steps.pin.outputs.ref }}
          SCRIPT_SHA256: ${{ steps.pin.outputs.script_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$PINNED_REF"
          url="https://raw.githubusercontent.com/zheref/nen/${ref}/bootstrap/nen.sh"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/nen-bootstrap.sh"
          [[ "$SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::trusted bootstrap script digest must be 64 lowercase hex digits."; exit 1; }
          printf '%s  %s\n' "$SCRIPT_SHA256" "${RUNNER_TEMP}/nen-bootstrap.sh" | sha256sum -c -
          bin="$(bash "${RUNNER_TEMP}/nen-bootstrap.sh" --ref "$ref")"
          [ -x "$bin" ] || { echo "::error::bootstrap printed '$bin', which is not executable."; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Verify the nen binary against trusted nen/contract.json's sha256
        env:
          NEN_BIN: ${{ steps.nen.outputs.bin }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$NEN_BIN" ] || { echo "::error::no bootstrapped nen binary to hash at '${NEN_BIN}'."; exit 1; }
          [ -f .trusted/nen/contract.json ] || { echo "::error::no trusted nen/contract.json to read the expected sha256 from."; exit 1; }
          observed="$(sha256sum "$NEN_BIN")" || { echo "::error::could not hash the bootstrapped nen binary at '${NEN_BIN}'."; exit 1; }
          observed="${observed%% *}"
          expected="$(jq -j '.dependency.bootstrap.sha256["linux-x64"] // empty' .trusted/nen/contract.json 2>/dev/null && printf .)" || expected=""
          expected="${expected%.}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            shown="${expected//[^0-9A-Za-z]/?}"
            echo "::error::trusted nen/contract.json records no well-formed dependency.bootstrap.sha256[\"linux-x64\"]: expected 64 lowercase hex characters, found '${shown:0:80}'; observed ${observed}."
            exit 1
          fi
          if [ "$observed" != "$expected" ]; then
            echo "::error::the bootstrapped nen binary does not match trusted nen/contract.json: expected sha256 ${expected}, observed ${observed}."
            exit 1
          fi
          echo "nen binary sha256 ${observed} matches trusted nen/contract.json (linux-x64)."
          nen_version="$("$NEN_BIN" --version)" || { echo "::error::the bootstrapped nen binary matches its sha256 but does not run (--version failed)."; exit 1; }
          echo "nen: ${nen_version} at $NEN_BIN"

      - name: Canon prose lint
        env:
          NEN_BIN: ${{ steps.nen.outputs.bin }}
        shell: bash
        run: |
          set -uo pipefail
          [ -x "$NEN_BIN" ] || { echo "::error::no bootstrapped nen binary at '${NEN_BIN}'."; exit 1; }
          rules=.trusted/contracts/prose.lint.json
          base=.trusted/contracts/prose.lint.baseline.json
          [ -f "$rules" ] && [ -f "$base" ] || { echo "::error::trusted canon prose rules or baseline is missing."; exit 1; }
          stop="stop_$(openssl rand -hex 16)" || stop=""
          [[ "$stop" =~ ^stop_[0-9a-f]{32}$ ]] || { echo "::error::could not draw a fresh token to fence the lint's output; nothing was read."; exit 1; }
          code=0
          echo "::stop-commands::${stop}"
          "$NEN_BIN" canon lint --root "$PWD" --rules "$PWD/$rules" --baseline contracts/prose.lint.baseline.json --base-baseline "$PWD/$base" --skill-paths 'claude/skills/*/SKILL.md,claude/agents/*.md,claude/rules/*.md' 2>&1 || code=$?
          printf '\n::%s::\n' "$stop"
          case "$code" in
            0) echo "no canon prose finding outside the baseline." ;;
            1)
              echo "::error::a canon prose finding outside contracts/prose.lint.baseline.json, a stale baseline row, or a row grown over the base revision's baseline; each is named above. Fix the prose or remove the stale row; the baseline never grows (HR-13)."
              exit 1
              ;;
            *)
              echo "::error::the canon prose lint could not run (exit ${code}), a wiring refusal. See its output above."
              exit 1
              ;;
          esac

      - name: Finish check on the exact PR head
        if: ${{ always() && steps.head_check.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.head_check.outputs.id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) conclusion=success ;;
            cancelled) conclusion=cancelled ;;
            *) conclusion=failure ;;
          esac
          gh api --method PATCH "repos/${REPO}/check-runs/${CHECK_ID}" -f status=completed -f conclusion="$conclusion" >/dev/null
